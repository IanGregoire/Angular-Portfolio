<section class="technology">
  <div class="container">
    <h2 class="section-title">Technologies I Use</h2>

    <p class="section-subtitle">
      A collection of tools, languages, and frameworks I regularly work with.
    </p>

    <div class="tech-grid">
      <div class="tech-card" *ngFor="let tech of technologies">
        <div class="icon-wrapper">
          <i [class]="tech.icon"></i>
        </div>
        <h3>{{ tech.name }}</h3>
        <p>{{ tech.description }}</p>
      </div>
    </div>
  </div>
</section>
