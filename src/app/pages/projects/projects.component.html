<section class="projects">
  <div class="container">
    <h2 class="section-title">My Projects</h2>
    <p class="section-subtitle">
      A showcase of my work, from web apps to small experiments.
    </p>

    <div class="projects-grid">
      <div class="project-card" *ngFor="let project of projects">
        <div class="project-image">
          <img [src]="project.image" [alt]="project.title" />
        </div>
        <div class="project-info">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          <div class="project-links">
            <a *ngIf="project.demo" [href]="project.demo" target="_blank" class="btn btn-primary">
              Live Demo
            </a>
            <a *ngIf="project.repo" [href]="project.repo" target="_blank" class="btn btn-secondary">
              GitHub
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
