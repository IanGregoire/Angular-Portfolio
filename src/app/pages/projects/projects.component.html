<section class="projects">
  <div class="container">
    <h2 class="section-title">Projects</h2>
    <p class="section-subtitle">
      Selected work showcasing frontend architecture, UI engineering,
      and full-stack integration.
    </p>

    <div class="projects-grid">
      <article
        class="project-card"
        *ngFor="let project of projects"
      >
        <!-- Image -->
        <div class="project-image">
          <img
            [src]="project.image"
            [alt]="project.title"
            loading="lazy"
          />

          <!-- Status badge -->
          <span
            class="status-badge"
            *ngIf="project.status"
            [class.live]="project.status === 'live'"
            [class.wip]="project.status === 'wip'"
          >
            {{ project.status === 'live' ? 'Live' : 'In Progress' }}
          </span>
        </div>

        <!-- Content -->
        <div class="project-info">
          <h3>{{ project.title }}</h3>
          <p class="description">
            {{ project.description }}
          </p>

          <!-- Tech stack -->
          <ul class="tech-list">
            <li *ngFor="let tech of project.tech">
              {{ tech }}
            </li>
          </ul>

          <!-- Actions -->
          <div class="project-actions">
            <!-- Internal project page -->
            <a
              *ngIf="project.route"
              class="btn btn-primary"
              [routerLink]="project.route"
            >
              View Project
            </a>

            <!-- External live demo -->
            <a
              *ngIf="!project.route && project.liveUrl"
              class="btn btn-primary"
              [href]="project.liveUrl"
              target="_blank"
              rel="noopener noreferrer"
            >
              Live Demo
            </a>

            <!-- Source code -->
            <a
              *ngIf="project.repoUrl"
              class="btn btn-outline"
              [href]="project.repoUrl"
              target="_blank"
              rel="noopener noreferrer"
            >
              View Code
            </a>
          </div>
        </div>
      </article>
    </div>
  </div>
</section>
